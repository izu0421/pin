<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0a5b64"/>
  <!-- Myelin lamellae (concentric rings) -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#7ac4cd" stroke-width="2.5" opacity="0.55"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#a8dae0" stroke-width="2.5" opacity="0.75"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#d7ebee" stroke-width="2.5"/>
  <!-- Axon core -->
  <circle cx="32" cy="32" r="6" fill="#f7f6f2"/>
  <!-- Small immune-cell dots on the outer ring -->
  <circle cx="10" cy="32" r="3" fill="#c85757"/>
  <circle cx="54" cy="32" r="3" fill="#c85757"/>
  <circle cx="32" cy="10" r="2.5" fill="#f2c94c"/>
</svg>
